events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream migrateflow_api {
        zone migrateflow_api 64k;
        least_conn;
        server backend:8000 resolve;
    }

    upstream migrateflow_ui {
        server frontend:80;
    }

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

    server {
        listen 80;
        client_max_body_size 12m;

        location = /health {
            proxy_pass http://migrateflow_api;
        }

        location ~ ^/(api|mock-target)/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 65s;
            proxy_buffering off;
            proxy_pass http://migrateflow_api;
        }

        location / {
            proxy_pass http://migrateflow_ui;
        }
    }
}
